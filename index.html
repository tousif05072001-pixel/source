<!DOCTYPE html>
<html>
<head>
    <title>Free Hugs ❤️</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            text-align: center;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 5px 20px #0002;
            max-width: 350px;
        }

        h1 {
            color: #ff4d6d;
        }

        .hug {
            font-size: 100px;
            margin: 20px;
        }

        p {
            color: #555;
            font-size: 18px;
        }

        button {
            background: #ff4d6d;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 18px;
            border-radius: 25px;
            cursor: pointer;
        }

        button:hover {
            background: #e63956;
        }

        #message {
            color: #ff4d6d;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <div class="box">
        <h1>Sending You a Hug! ❤️</h1>

        <div class="hug">🫂</div>

        <p>You deserve love, happiness, and a big warm hug!</p>

        <button onclick="hugMe()">Get a Hug 🤗</button>

        <div id="message"></div>
    </div>

    <script>
        function hugMe() {
            document.getElementById("message").innerHTML =
                "🤗 Sending you the biggest hug! ❤️";
        }
    </script>

</body>
</html>
